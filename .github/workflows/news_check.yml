name: News awareness check

on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 minutes
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check for important news
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python news_check.py

      - name: Commit updated seen-news state
        run: |
          git config user.name "luno-bot"
          git config user.email "actions@users.noreply.github.com"
          git config merge.ours.driver true
          git add state/news_seen.json
          git diff --staged --quiet && exit 0
          git commit -m "news check $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            if ! git fetch origin main; then
              echo "fetch failed on attempt $i - retrying"
              sleep 3
              continue
            fi
            if ! git rebase origin/main; then
              echo "rebase conflict on attempt $i - aborting and retrying"
              git rebase --abort
            fi
            sleep 3
          done
          echo "::error::Failed to push after 5 retries"
          exit 1
