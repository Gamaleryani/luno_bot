name: Respond to Approval

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Which strategy's pending trade"
        required: true
        type: choice
        options:
          - trend_4h
          - range_1h_defensive
      decision:
        description: "Approve executes it now; reject cancels it outright"
        required: true
        type: choice
        options:
          - approve
          - reject

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Record decision
        run: python approve_trade.py "${{ inputs.profile }}" "${{ inputs.decision }}"

      - name: Commit updated state
        run: |
          git config user.name "luno-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --staged --quiet && exit 0
          git commit -m "${{ inputs.decision }}: ${{ inputs.profile }} pending trade"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo "::error::Failed to push after 5 retries"
          exit 1
