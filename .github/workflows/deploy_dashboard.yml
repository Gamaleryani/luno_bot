name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard.html"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Explicit ref: main - without this, checkout defaults to the SHA
      # that triggered the workflow. When called via `uses:` from
      # trend_4h.yml/range_1h_defensive.yml's "run" job (needs: run), that
      # pinned SHA predates the "run" job's own commit (the freshly
      # regenerated dashboard.html) - deploying it silently serves stale
      # content one run behind. Always deploying HEAD of main fixes this.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp static/manifest.json static/sw.js static/icon-192.png static/icon-512.png static/apple-touch-icon.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
